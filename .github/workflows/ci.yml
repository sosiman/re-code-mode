name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y radare2 binwalk upx-ucl unzip binutils file build-essential
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Shell syntax
        run: bash -n bin/re-run.sh scripts/setup.sh scripts/fetch-skills.sh
